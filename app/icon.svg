  <line x1="32" y1="3" x2="32" y2="7" stroke="#39ff88"/>
  <line x1="46.5" y1="6.89" x2="44.5" y2="10.35" stroke="#39ff88"/>
  <line x1="57.11" y1="17.5" x2="53.65" y2="19.5" stroke="#39ff88"/>
  <line x1="61" y1="32" x2="57" y2="32" stroke="#39ff88"/>
  <line x1="57.11" y1="46.5" x2="53.65" y2="44.5" stroke="#39ff88"/>
